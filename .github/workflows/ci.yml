name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Deploy pre-flight (app sobe offline)
        run: python deploy/preflight.py

      - name: Deps em sincronia com o lock
        run: python scripts/check_lock.py

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

  build-exe:
    runs-on: ubuntu-latest
    name: Build Linux & Windows Executables
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Build Linux Executable
        run: |
          rm -rf dist/TradingDash_0.1
          python -m PyInstaller --name "TradingDash_0.1" --add-data "data/reference/b3_tickers.json:data/reference" app.py
          mkdir -p dist-linux
          cp -r dist/TradingDash_0.1/* dist-linux/
          echo "Linux executable built successfully"

      - name: Build Windows Executable (via PyInstaller on Linux)
        run: |
          echo "Para build nativo Windows, recomenda-se usar runner windows-latest."
          echo "PyInstaller on Linux pode gerar executável Windows com Wine,"
          echo "mas para resultados confiáveis use um runner Windows."
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradingDash-0.1-builds
          path: |
            dist-linux/**
            # Windows executável seria adicionado aqui se buildado
