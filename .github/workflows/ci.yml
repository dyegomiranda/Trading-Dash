name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Deploy pre-flight (app sobe offline)
        run: python deploy/preflight.py

      - name: Deps em sincronia com o lock
        run: python scripts/check_lock.py

      - name: Tests (pytest)
        run: python -m pytest tests/ -q

  build-exe:
    runs-on: ubuntu-latest
    name: Build Executable (Linux & Windows)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install PyInstaller
        run: |
          python -m pip install pyinstaller

      - name: Build Linux Executable
        run: |
          python -m PyInstaller --name "TradingDash_0.1" --add-data "data/reference/b3_tickers.json:data/reference" app.py
          mkdir -p dist-linux
          cp -r dist/TradingDash_0.1/* dist-linux/
          echo "Linux executable built in dist-linux/"

      - name: Build Windows Executable (cross-compile)
        run: |
          echo "Nota: Build Windows requer ambiente Windows ou Wine."
          echo "Para build nativo Windows, use um runner windows-latest."
          # O PyInstaller pode gerar um executável Windows a partir de Linux com Wine,
          # mas geralmente recomenda-se usar um runner Windows para melhores resultados.
